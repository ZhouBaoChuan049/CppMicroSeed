# 这个配置文件和gflag的配置文件又有不同,
#FastDFS 使用的是传统的 Key-Value 配置解析机制。
# 连接 Tracker Server 的超时时间，单位：秒
connect_timeout = 5
# 网络通信超时时间，单位：秒
network_timeout = 60
# Tracker Server 的地址和端口，支持配置多个 Tracker Server
tracker_server = dev-tracker:22122
# 是否启用连接池
use_connection_pool = false
# 连接池中空闲连接的最大存活时间，单位：秒
connection_pool_max_idle_time = 3600
