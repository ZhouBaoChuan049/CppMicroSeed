<!-- 这是一个验证码Mail的一个样例,灵感来自ChatGPT的登录邮件样式~~ -->
<!DOCTYPE html>
<html>
<body style="font-family:Arial,sans-serif;background:#fff;">
    <div style="max-width:600px;margin:40px auto;padding:30px;">
        <h1 style="color:#000;font-size:36px;">EchoMind智能服务</h1>
        <p style="font-size:20px;color:#333;margin-top:60px;">
            输入此临时验证码以继续:
        </p>
        <div style="background:#f2f2f2;border-radius:24px;
                    padding:35px 40px;margin:40px 0;">
            <span style="font-size:40px;letter-spacing:5px;color:#555;">
                {{VERIFY_CODE}}
            </span>
        </div>
        <p style="font-size:18px;color:#333;">
            如果你没有尝试登录，请忽略此邮件。
        </p>
        <p style="color:#999;margin-top:70px;">
            谨致问候<br>EchoMind智能服务团队
        </p>
    </div>
</body>
</html>
